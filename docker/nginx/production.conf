limit_req_zone $binary_remote_addr zone=public_submission_post:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=public_submission_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 25M;
    client_body_timeout 120s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /.env {
        deny all;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
    }

    # This is the only directly served upload tree. Private files remain
    # outside the document root and are streamed by authorized controllers.
    location /storage/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location ~ ^/competitions/[0-9]+/submissions$ {
        limit_req zone=public_submission_post burst=10 nodelay;
        limit_conn public_submission_connections 10;
        limit_req_status 429;

        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        internal;
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";

        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }
}
