limit_req_zone $binary_remote_addr zone=public_submission_post:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=public_submission_connections:10m;

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 25M;
    client_body_timeout 120s;
    client_header_timeout 15s;

    location ~ ^/competitions/[0-9]+/submissions$ {
        limit_req zone=public_submission_post burst=10 nodelay;
        limit_conn public_submission_connections 10;
        limit_req_status 429;

        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass app:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
