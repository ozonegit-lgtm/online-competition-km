services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: competition_km_app
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - competition_km_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - competition_km_network

  nginx:
    image: nginx:1.27-alpine
    container_name: competition_km_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - competition_km_network

  db:
    image: mariadb:10.4
    container_name: competition_km_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - competition_km_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - competition_km_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: competition_km_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db
    networks:
      - competition_km_network

  node:
    image: node:22-alpine
    container_name: competition_km_node
    working_dir: /var/www/html
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - competition_km_node_modules:/var/www/html/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - competition_km_network

networks:
  competition_km_network:
    driver: bridge

volumes:
  competition_km_db_data:
  competition_km_node_modules:
  competition_km_vendor: