name: online-competition-km-prod

services:
  app:
    image: online-competition-km-app:production
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_OPTIMIZE: "true"
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - edge

  nginx:
    image: online-competition-km-nginx:production
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8080}:80"
    volumes:
      - ./storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - edge

  db:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in the production env file}
      MARIADB_USER: ${DB_USERNAME:?Set DB_USERNAME in the production env file}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the production env file}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in the production env file}
    volumes:
      - competition_km_db_data_114:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  backend:
    internal: true
  edge:

volumes:
  competition_km_db_data_114:
    external: true
    name: online-competition-km_competition_km_db_data_114
